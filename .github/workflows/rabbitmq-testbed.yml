name: RabbitMQ Testbed

on:
  push:
  workflow_dispatch:
    inputs:
      rabbitmq_version:
        description: "RabbitMQ image tag to test (e.g. 4.4.0-management). Leave empty to run the default matrix: pinned current-prod plus the newest published release."
        required: false
        type: string
      plugin_source:
        description: "Plugin source to install for the manual run (only used when rabbitmq_version is set)"
        required: false
        type: choice
        options: [cloudamqp, archived]
        default: cloudamqp
      plugin_version:
        description: "Plugin version tag matching plugin_source (e.g. 4.3.1 for cloudamqp, 4.2.0 for archived)"
        required: false
        type: string
      benchmark_iterations:
        description: "Messages per benchmark scenario. Empty keeps the 200 used on every push; raise it (e.g. 5000) for an on-demand soak run."
        required: false
        type: string

permissions:
  contents: read

jobs:

  setup:

    runs-on: ubuntu-24.04
    outputs:
      php-versions: ${{ steps.versions.outputs.php-versions }}
      broker-configs: ${{ steps.brokers.outputs.broker-configs }}

    steps:
      # Single source of truth for the PHP-version axis, shared by testbed + benchmark below.
      # Keep in sync with the testing-php matrix in ci.yaml.
      - id: versions
        run: echo 'php-versions=["8.3", "8.4", "8.5"]' >> "$GITHUB_OUTPUT"

      # Single source of truth for the broker-version axis. Two legs always run:
      #
      #   current-prod - pinned to the version production actually runs. A failure here is real.
      #   next-target  - resolved on the fly to the newest published RabbitMQ image plus the
      #                  newest CloudAMQP plugin release, so a fresh upstream release is picked
      #                  up without a commit here. Non-blocking: it is an early warning, and a
      #                  brand new release without a matching plugin build must not redden a
      #                  push that has nothing to do with it.
      #
      # If the newest published version *is* current-prod, or either lookup fails, the second leg
      # falls back to the previous production version, so two distinct brokers are always tested.
      #
      # A manual workflow_dispatch run with rabbitmq_version set tests exactly that one
      # version/plugin combination instead - e.g. to spot-check a release candidate.
      - id: brokers
        env:
          CURRENT_VERSION: "4.3.3-management"
          CURRENT_PLUGIN_SOURCE: cloudamqp
          CURRENT_PLUGIN_VERSION: "4.3.1"
          FALLBACK_VERSION: "4.2.6-management"
          FALLBACK_PLUGIN_SOURCE: archived
          FALLBACK_PLUGIN_VERSION: "4.2.0"
          RABBITMQ_VERSION: ${{ github.event.inputs.rabbitmq_version }}
          PLUGIN_SOURCE: ${{ github.event.inputs.plugin_source }}
          PLUGIN_VERSION: ${{ github.event.inputs.plugin_version }}
        run: |
          if [ -n "${RABBITMQ_VERSION}" ]; then
            config=$(jq -nc \
              --arg rabbitmq_version "${RABBITMQ_VERSION}" \
              --arg plugin_source "${PLUGIN_SOURCE:-cloudamqp}" \
              --arg plugin_version "${PLUGIN_VERSION}" \
              '[{name: "manual", rabbitmq_version: $rabbitmq_version, plugin_source: $plugin_source, plugin_version: $plugin_version, tolerate_failure: false}]')
          else
            # Newest published image tag, not newest git tag: an announced release whose image is
            # not on Docker Hub yet would only produce a pull failure here.
            latest_version=""
            if tags=$(curl -fsS --max-time 30 'https://hub.docker.com/v2/repositories/library/rabbitmq/tags?page_size=100&ordering=last_updated'); then
              latest_version=$(printf '%s' "$tags" | jq -r '.results[].name' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-management$' | sort -V | tail -n1)
            fi

            latest_plugin=""
            if release=$(curl -fsS --max-time 30 https://api.github.com/repos/cloudamqp/rabbitmq-delayed-message-exchange/releases/latest); then
              latest_plugin=$(printf '%s' "$release" | jq -r '.tag_name // ""' | sed 's/^v//')
            fi

            if [ -n "$latest_version" ] && [ -n "$latest_plugin" ] && [ "$latest_version" != "$CURRENT_VERSION" ]; then
              echo "next-target resolved to ${latest_version} + cloudamqp plugin ${latest_plugin}"
              second=$(jq -nc \
                --arg rabbitmq_version "$latest_version" \
                --arg plugin_version "$latest_plugin" \
                '{name: "next-target", rabbitmq_version: $rabbitmq_version, plugin_source: "cloudamqp", plugin_version: $plugin_version, tolerate_failure: true}')
            else
              echo "nothing newer than ${CURRENT_VERSION} published (or the lookup failed) - second leg falls back to ${FALLBACK_VERSION}"
              second=$(jq -nc \
                --arg rabbitmq_version "$FALLBACK_VERSION" \
                --arg plugin_source "$FALLBACK_PLUGIN_SOURCE" \
                --arg plugin_version "$FALLBACK_PLUGIN_VERSION" \
                '{name: "previous-prod", rabbitmq_version: $rabbitmq_version, plugin_source: $plugin_source, plugin_version: $plugin_version, tolerate_failure: false}')
            fi

            config=$(jq -nc \
              --arg rabbitmq_version "$CURRENT_VERSION" \
              --arg plugin_source "$CURRENT_PLUGIN_SOURCE" \
              --arg plugin_version "$CURRENT_PLUGIN_VERSION" \
              --argjson second "$second" \
              '[{name: "current-prod", rabbitmq_version: $rabbitmq_version, plugin_source: $plugin_source, plugin_version: $plugin_version, tolerate_failure: false}, $second]')
          fi
          echo "broker-configs=$(echo "$config" | jq -c .)" >> "$GITHUB_OUTPUT"

  testbed:

    needs: setup
    runs-on: ubuntu-24.04
    # The floating next-target leg must not gate a push: a brand new RabbitMQ release whose
    # plugin build does not exist yet is upstream news, not a regression in this library.
    continue-on-error: ${{ matrix.broker.tolerate_failure }}

    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(needs.setup.outputs.php-versions) }}
        broker: ${{ fromJSON(needs.setup.outputs.broker-configs) }}

    steps:
      - uses: actions/checkout@v7

      - name: Build testbed broker image (${{ matrix.broker.name }})
        run: |
          docker build \
            --build-arg RABBITMQ_VERSION=${{ matrix.broker.rabbitmq_version }} \
            --build-arg PLUGIN_SOURCE=${{ matrix.broker.plugin_source }} \
            --build-arg PLUGIN_VERSION=${{ matrix.broker.plugin_version }} \
            -t nachricht-testbed-rabbitmq \
            ./docker/rabbitmq

      - name: Run testbed broker
        run: |
          docker run -d --name rabbitmq -p 5672:5672 -p 15672:15672 nachricht-testbed-rabbitmq

      - name: Wait for broker to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec rabbitmq rabbitmq-diagnostics check_running >/dev/null 2>&1; then
              echo "broker ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "broker never became ready" >&2
          docker logs rabbitmq
          exit 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run RabbitMQ testbed correctness matrix
        env:
          AMQP_TEST_HOST: localhost
          AMQP_TEST_PORT: 5672
          AMQP_TEST_HTTP_PORT: "15672"
        run: composer phpunit-integration

      - name: Broker logs
        if: always()
        run: docker logs rabbitmq

  benchmark:

    needs: [setup, testbed]
    runs-on: ubuntu-24.04
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(needs.setup.outputs.php-versions) }}
        broker: ${{ fromJSON(needs.setup.outputs.broker-configs) }}

    steps:
      - uses: actions/checkout@v7

      - name: Build testbed broker image (${{ matrix.broker.name }})
        run: |
          docker build \
            --build-arg RABBITMQ_VERSION=${{ matrix.broker.rabbitmq_version }} \
            --build-arg PLUGIN_SOURCE=${{ matrix.broker.plugin_source }} \
            --build-arg PLUGIN_VERSION=${{ matrix.broker.plugin_version }} \
            -t nachricht-testbed-rabbitmq \
            ./docker/rabbitmq

      - name: Run testbed broker
        run: |
          docker run -d --name rabbitmq -p 5672:5672 -p 15672:15672 nachricht-testbed-rabbitmq

      - name: Wait for broker to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec rabbitmq rabbitmq-diagnostics check_running >/dev/null 2>&1; then
              echo "broker ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "broker never became ready" >&2
          docker logs rabbitmq
          exit 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run publish/consume benchmark (${{ matrix.broker.name }}, PHP ${{ matrix.php-version }})
        env:
          AMQP_TEST_HOST: localhost
          AMQP_TEST_PORT: 5672
          AMQP_TEST_HTTP_PORT: "15672"
          BENCHMARK_BROKER: ${{ matrix.broker.name }}
          BENCHMARK_PHP_VERSION: ${{ matrix.php-version }}
          BENCHMARK_ITERATIONS: ${{ github.event.inputs.benchmark_iterations }}
        run: composer phpunit-benchmark

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.broker.name }}-php${{ matrix.php-version }}
          path: build/benchmark-*.json
          if-no-files-found: ignore

  # Deliberately separate from the correctness matrix: a restart cycle costs ~60s, and the
  # behaviour under test is broker-side, so one PHP version per broker leg is enough. Comparing
  # both legs is the point - the archived plugin kept scheduled messages in Mnesia, the fork
  # keeps bodies in Leveled on disk, so their restart behaviour may genuinely differ.
  broker-restart:

    needs: setup
    runs-on: ubuntu-24.04
    # The floating next-target leg must not gate a push: a brand new RabbitMQ release whose
    # plugin build does not exist yet is upstream news, not a regression in this library.
    continue-on-error: ${{ matrix.broker.tolerate_failure }}

    strategy:
      fail-fast: false
      matrix:
        broker: ${{ fromJSON(needs.setup.outputs.broker-configs) }}

    steps:
      - uses: actions/checkout@v7

      - name: Build testbed broker image (${{ matrix.broker.name }})
        run: |
          docker build \
            --build-arg RABBITMQ_VERSION=${{ matrix.broker.rabbitmq_version }} \
            --build-arg PLUGIN_SOURCE=${{ matrix.broker.plugin_source }} \
            --build-arg PLUGIN_VERSION=${{ matrix.broker.plugin_version }} \
            -t nachricht-testbed-rabbitmq \
            ./docker/rabbitmq

      - name: Run testbed broker
        run: |
          docker run -d --name rabbitmq -p 5672:5672 -p 15672:15672 nachricht-testbed-rabbitmq

      - name: Wait for broker to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec rabbitmq rabbitmq-diagnostics check_running >/dev/null 2>&1; then
              echo "broker ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "broker never became ready" >&2
          docker logs rabbitmq
          exit 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run broker-restart persistence test (${{ matrix.broker.name }})
        env:
          AMQP_TEST_HOST: localhost
          AMQP_TEST_PORT: 5672
          AMQP_TEST_HTTP_PORT: "15672"
          AMQP_TEST_BROKER_RESTART_CMD: docker restart rabbitmq
        run: composer phpunit-broker-restart

      - name: Broker logs
        if: always()
        run: docker logs rabbitmq
